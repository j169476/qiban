<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>栖伴 · 卸载准备</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/qiban.css"><link rel="stylesheet" href="/probe.css"><script src="/feedback.js" defer></script><script src="/uninstall.js" defer></script></head>
<body data-nav-page="uninstall" data-uninstall="loading">
<main class="probe">
<header class="probe-topbar">
<h1 class="probe-brand"><img class="probe-brand-mark" src="/static/white-dragon-tea.png" alt="" width="26" height="26" aria-hidden="true"><span>栖伴 <span class="probe-brand-en">Qiban</span></span></h1>
<p id="notice" class="probe-topbar-notice" role="status"></p>
<div class="probe-menu-wrap"><button type="button" id="uninstall-exit" class="probe-menu-toggle">取消并退出</button></div>
</header>
<div class="probe-shell">
<nav class="app-nav" id="uninstall-nav" aria-label="卸载步骤">
<ul class="app-nav-list">
<li><button type="button" class="app-nav-link" data-step="prepare" aria-current="page" disabled>1 · 查看影响</button></li>
<li><button type="button" class="app-nav-link" data-step="backup" disabled>2 · 备份资料（可选）</button></li>
<li><button type="button" class="app-nav-link" data-step="confirm" disabled>3 · 确认并卸载</button></li>
</ul>
<div class="app-nav-room"><p class="note">卸载默认保留个人资料。</p></div>
</nav>
<div class="probe-center">
<div class="probe-page-heading"><h2>卸载准备</h2><p id="uninstall-service" class="probe-service-state" role="status">正在读取卸载信息……</p></div>
<section class="card" id="uninstall-panel">
<h2>先备份，再卸载</h2>
<p id="uninstall-summary">卸载会删除程序文件和快捷方式，个人资料默认保留。</p>
<p id="uninstall-entry" class="note"></p>
<h3>第一步 · 备份资料（可选）</h3>
<p class="note" id="uninstall-backup-location"></p>
<p class="note">换电脑恢复请选择便携备份。</p>
<div class="actions"><button id="backup-create">保存本机加密备份</button></div>
<p id="backup-notice" role="status" aria-live="polite"></p>
<details id="unlock-area" hidden open><summary>栖伴已锁定</summary>
<p class="note">备份前需要先解锁。</p>
<label>应用密码 <input id="unlock-password" type="password" maxlength="256" autocomplete="current-password"></label>
<div class="actions"><button id="unlock" class="secondary">解锁栖伴</button></div>
<p id="unlock-notice" role="status"></p>
</details>
<details id="portable-area"><summary>也可以导出便携备份（换电脑恢复用）</summary>
<label>独立恢复口令 <input id="portable-password" type="password" minlength="16" maxlength="256" autocomplete="new-password"></label>
<label>再次输入独立恢复口令 <input id="portable-confirm" type="password" minlength="16" maxlength="256" autocomplete="new-password"></label>
<div class="actions"><button id="portable-export" class="secondary">导出便携备份</button></div>
<p id="portable-notice" role="status" aria-live="polite"></p>
</details>
<h3>第二步 · 继续卸载</h3>
<p class="note" id="uninstall-skip-note"></p>
<label class="uninstall-clear-option"><input id="uninstall-clear-profile" type="checkbox">同时清空当前用户的 Qiban 个人资料</label><p id="uninstall-clear-note" class="note"></p>
<div class="actions"><button id="uninstall-skip" class="secondary">跳过备份</button><button id="uninstall-continue" disabled>继续卸载…</button></div>
<p id="uninstall-result" role="status" aria-live="polite"></p>
</section>
</div>
<div class="probe-rail" role="complementary" aria-label="保留说明与当前结果">
<section class="card probe-rail-card"><h2>默认保留的内容</h2>
<p id="uninstall-retention"></p>

<p class="note">个人资料默认保留；自己另存的便携备份请放在程序目录之外。</p>
</section>
<section class="card probe-rail-card"><h2>当前结果</h2>
<p id="uninstall-status" role="status" aria-live="polite">尚未开始。</p>
</section>
<img class="probe-rail-art" src="/static/white-dragon-tea.png" alt="捧着茶杯的栖伴白龙娘">
</div>
</div>
</main>
<dialog id="uninstall-confirm" aria-labelledby="uninstall-confirm-title" aria-describedby="uninstall-confirm-text">
<h2 id="uninstall-confirm-title">确认继续卸载？</h2>
<p id="uninstall-confirm-text"></p>
<div class="actions"><button id="uninstall-confirm-yes">继续卸载</button><button id="uninstall-confirm-no" class="secondary">返回</button></div>
</dialog>
</body></html>
