<section class="card">
  <h2>模型与思考方式</h2>

  <div class="actions"><button id="model-load" class="secondary">读取当前设置</button><button id="model-refresh" class="secondary">刷新可选模型</button></div>
  <p id="model-state" role="status">尚未读取。这里的设置不会修改 Codex 管理聊天或其他项目的模型。</p>
  <div id="model-effective" class="quota-grid"></div>
  <form id="model-settings-form" class="reply-search-form" hidden>
    <label>作用范围<select id="model-scope"><option value="global">全局默认</option><option value="local">本机会客室</option><option value="bilibili">B站</option><option value="qq">QQ</option><option value="wechat">微信</option></select></label>
    <label class="reply-search-identity">模型<select id="model-choice"></select></label>
    <label>推理档位<select id="model-effort"></select></label>
    <button type="submit">保存模型选择</button>
  </form>

</section>
