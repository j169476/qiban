<section class="card">
  <h2>QQ / 微信接入向导</h2>

  <label>选择平台<select id="setup-platform"><option value="qq">QQ</option><option value="wechat">微信</option></select></label>
  <div class="actions"><button id="setup-load" class="secondary">检查现有配置</button><button id="setup-prepare" class="secondary" disabled>准备连接依赖</button></div>
  <p id="setup-status" role="status">选择平台后，先检查现有配置。</p>
  <p id="setup-instructions" class="task-hint"></p>
  <div id="setup-qq-guide" class="actions"><a href="https://napneko.github.io/guide/boot/Shell" target="_blank" rel="noopener noreferrer">NapCat 官方安装与登录向导 ↗</a><a id="setup-qq-login" hidden target="_blank" rel="noopener noreferrer">打开 QQ 连接器 ↗</a></div>
  <form id="setup-form" hidden>
    <div id="setup-qq-fields" class="quota-fields">
      <label>机器人 QQ 号<input id="setup-qq-account" inputmode="numeric" maxlength="20"></label>
      <label>HTTP 地址<input id="setup-qq-http" value="http://127.0.0.1:3000"></label>
      <label>正向 WebSocket 地址<input id="setup-qq-ws" value="ws://127.0.0.1:3001"></label>
      <label>NapCat 启动程序（可选）<input id="setup-qq-executable" placeholder="完整的可执行程序路径"></label>
      <label>NapCat 工作目录<input id="setup-qq-directory" placeholder="完整目录路径"></label>
      <label>启动参数<textarea id="setup-qq-arguments" rows="3" placeholder="每行一个参数"></textarea></label>
      <label>启动等待秒数<input id="setup-qq-timeout" type="number" min="5" max="180" value="90"></label>
      <label>OneBot Token<input id="setup-qq-token" type="password" maxlength="512" autocomplete="new-password" placeholder="已保存时留空保留"></label>
      <label>追加私聊 QQ 号<textarea id="setup-qq-private" rows="3" placeholder="每行一个 QQ 号"></textarea></label>
      <label>追加群号<textarea id="setup-qq-groups" rows="3" placeholder="每行一个群号"></textarea></label>
    </div>
    <div id="setup-wechat-fields" hidden>
      <label>微信账号数据目录<textarea id="setup-wechat-dirs" rows="2" placeholder="填写含 db_storage 的账号目录，每行一个候选路径"></textarea></label>
      <p id="setup-wechat-existing" class="task-hint"></p>

      <div class="quota-fields"><label>追加私聊内部 ID / 微信号<textarea id="setup-wechat-private" rows="3" placeholder="每行一个"></textarea></label><label>追加群内部 ID<textarea id="setup-wechat-groups" rows="3" placeholder="例如 123456789@chatroom，每行一个"></textarea></label></div>

    </div>
    <button type="submit">保存并保持暂停</button>
  </form>
  <div class="actions"><button id="setup-probe" disabled>核验登录账号与对象</button><button class="quiet" data-go="platforms">完成后管理回复授权</button></div>

</section>
