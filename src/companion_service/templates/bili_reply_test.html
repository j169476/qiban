<details class="card" id="bili-reply-test">
  <summary>限定对象的 B站私信验收</summary>
  <form id="bili-test-form">
    <div class="quota-fields">
      <label>机器人 UID<input id="bili-test-account" type="text" inputmode="numeric" pattern="[1-9][0-9]{0,19}" maxlength="20" required autocomplete="off"></label>
      <label>唯一测试对象 UID<input id="bili-test-target" type="text" inputmode="numeric" pattern="[1-9][0-9]{0,19}" maxlength="20" required autocomplete="off"></label>
      <label>验收时限（分钟）<input id="bili-test-duration" type="number" min="1" max="30" value="10" required></label>
    </div>
    <button id="bili-test-start" type="submit">启动限定私信验收</button>
  </form>
</details>
