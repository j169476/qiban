<section class="card"><h2>一起做点什么</h2>

<form id="explicit-task"><fieldset id="task-fields" disabled>
<label>任务类型<select id="task-kind"><option value="web">查网页资料</option><option value="learn">专题学习 · 网页资料</option><option value="video">B站视频按区间补读</option><option value="image">生成图片</option></select></label>
<label id="task-prompt-label">要求<textarea id="task-prompt" rows="3" maxlength="2000" required placeholder="写下要查什么、学习目标，或图片要求"></textarea></label>
<div id="task-learn-fields" hidden><label>验收要点（每行一项，最多 6 项）<textarea id="task-criteria" rows="3" maxlength="3000"></textarea></label><label>最多学习轮数<input id="task-rounds" type="number" min="1" max="6" value="2"></label></div>
<div id="task-video-fields" hidden><div class="task-grid"><label>视频 BV 号<input id="task-bvid" pattern="BV[0-9A-Za-z]{10}" maxlength="12" placeholder="BV…"></label><label>分 P 序号（从 1 开始）<input id="task-page" type="number" min="1" max="1000" value="1"></label><label>开始秒数<input id="task-start" type="number" min="0" max="86400" value="0"></label><label>结束秒数<input id="task-end" type="number" min="1" max="86400" value="600"></label><label>阅读方式<select id="task-mode"><option value="text">字幕或转写文本</option><option value="visual">画面采样与文本</option></select></label></div></div>
<button type="submit">安排任务</button></fieldset></form>
<div class="section-heading"><h2>任务与结果</h2><button id="tasks-refresh" class="quiet">刷新</button></div><div id="task-list" aria-live="polite"></div>
</section>
