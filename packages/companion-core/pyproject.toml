[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-companion-core"
version = "0.8.0"
description = "Platform-independent local companion cognition, storage and identity services."
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5", "filelock>=3.16,<4", "Pillow>=11,<14", "tzdata>=2025.1"]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2,<4", "cryptography>=46,<51"]

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["companion_core*"]

[tool.setuptools.package-data]
companion_core = ["*.json", "sql/*.sql"]
