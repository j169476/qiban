[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-companion-qq"
version = "0.9.4"
description = "Scoped OneBot QQ connector with shared reply authorization and participation policy."
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["local-companion-core>=0.9.4,<0.10", "httpx>=0.28,<1", "websockets>=15,<17", "keyring>=25,<26"]

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["companion_qq*"]
