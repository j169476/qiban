[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-companion-qq"
version = "1.1.0"
description = "Native QQ connector with shared reply authorization and participation policy."
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["local-companion-core>=1.1.0,<1.2"]

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["companion_qq*"]
